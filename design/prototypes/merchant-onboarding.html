<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merchant Onboarding Prototype</title>
<style>
/* Palette (only these 4): #242424 ink · #9B9E95 grey · #DFFF00 volt · #F2F2E8 paper. Grey is for fills/borders only, never text. */
:root{--ink:#242424;--grey:#9B9E95;--volt:#DFFF00;--paper:#F2F2E8;--ink-a:rgba(36,36,36,.16);--grey-a:rgba(155,158,149,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;left:-9999px}
h1{font-size:27px;line-height:1.25;margin:0 0 6px}h2{font-size:21px;margin:0 0 6px}h3{font-size:17px;margin:0 0 4px}p{margin:0 0 10px}
.muted{opacity:.78;font-size:14px}.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}.between{justify-content:space-between}.mt{margin-top:16px}.mt2{margin-top:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* ---------- app shell ---------- */
.proto{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:13px}
.proto b{margin-right:4px}
.seg{display:inline-flex}.seg button{padding:5px 12px;font-size:13px;min-height:34px}
.sim{display:inline-flex;gap:4px;align-items:center;cursor:pointer;padding:4px 8px}
.stage{display:flex;justify-content:center;padding:22px 14px 60px}
.app{width:min(1040px,100%)}
.app.phone{width:392px}
.frame{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.app.phone .frame{grid-template-columns:1fr}
.app.phone .side{display:none}
.app.phone .grid2,.app.phone .grid3{grid-template-columns:1fr}.app.phone .grid4{grid-template-columns:1fr 1fr}
.side{padding:20px;position:sticky;top:60px}
.main{padding:26px 28px;min-width:0}
.app.phone .main{padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;margin-bottom:18px}
.logo{width:38px;height:38px;display:grid;place-items:center;font-weight:900}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 6px;font-size:14.5px}
.num{width:28px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.mtop{display:none;margin-bottom:14px}.app.phone .mtop{display:block}
.mbar{height:8px;overflow:hidden}.mbar i{display:block;height:100%}
.banner{padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:8px;align-items:center}
/* ---------- form controls ---------- */
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.inp{width:100%;padding:11px 14px;min-height:46px}
.hint{font-size:13px;opacity:.75;margin-top:4px}.err{font-size:13.5px;font-weight:600;margin-top:5px}
.btn{padding:12px 22px;min-height:48px;font-weight:700}.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.otp{display:flex;gap:8px}.otp input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;padding:0}
.card-opt{padding:16px;text-align:left;display:block;width:100%}
.card-opt .ic{font-size:26px;display:block;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 10px;text-align:left;vertical-align:middle}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;font-size:12.5px;font-weight:700}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}

.map{position:relative;height:200px;overflow:hidden;cursor:crosshair;touch-action:none;
  background:
   linear-gradient(90deg,transparent 49%,var(--grey) 49% 51%,transparent 51%) 0 0/120px 100%,
   linear-gradient(0deg,transparent 49%,var(--grey) 49% 51%,transparent 51%) 0 0/100% 90px,var(--grey-a)}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:0;line-height:0;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(36,36,36,.3))}
.em{color:transparent;text-shadow:0 0 0 var(--ink);font-style:normal}.pill.bad .em,.btn.pri .em{text-shadow:0 0 0 var(--paper)}
.hours{display:grid;grid-template-columns:90px 1fr auto auto;gap:8px;align-items:center;margin:6px 0}
.hours input[type=time]{padding:6px 8px;min-height:38px}
.shopcard{padding:14px 16px}
.lab{display:inline-block;padding:3px 12px;font-weight:700;font-size:13px}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(36,36,36,.5);padding:16px}
.modal.on{display:grid}.modal .box{width:min(460px,100%);padding:24px;max-height:90vh;overflow:auto}
.plan{padding:20px;display:flex;flex-direction:column}
.plan ul{list-style:none;padding:0;margin:12px 0;flex:1}.plan li{padding:6px 0;display:flex;justify-content:space-between;gap:10px;font-size:14.5px;border-bottom:1px dashed var(--ink-a)}
.price{font-size:26px;font-weight:800}
.kpi{padding:14px;text-align:center}.kpi b{display:block;font-size:26px}
@media (max-width:860px){.frame{grid-template-columns:1fr}.side{display:none}.mtop{display:block}.grid3,.grid4{grid-template-columns:1fr 1fr}.main{padding:20px 16px}}
@media (max-width:520px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.hours{grid-template-columns:70px 1fr auto}.hours .ex{display:none}.otp input{width:42px}}

/* ================= STYLE B — Flat bold (outlined, hard shadows, high contrast) ================= */
body[data-style=b]{background:var(--paper)}
[data-style=b] .clay,[data-style=b] .side,[data-style=b] .main,[data-style=b] .modal .box{background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink)}
[data-style=b] .main{background:var(--paper)}[data-style=b] .side{background:var(--grey)}
[data-style=b] .proto{background:var(--ink);color:var(--paper);border:0;border-radius:0;box-shadow:none}
[data-style=b] .proto button{border-color:var(--paper)}[data-style=b] .proto input[type=checkbox]{border-color:var(--paper)}
[data-style=b] button,[data-style=b] .btn{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-weight:700;transition:transform .08s,box-shadow .08s}
[data-style=b] button:hover:not([disabled]){background:var(--grey)}
[data-style=b] button:active:not([disabled]),[data-style=b] button.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
[data-style=b] button.on{background:var(--volt)}
[data-style=b] .btn.pri{background:var(--ink);color:var(--paper)}[data-style=b] .btn.pri:hover:not([disabled]){background:var(--volt);color:var(--ink)}
[data-style=b] .btn.sun{background:var(--volt)}
[data-style=b] .btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
[data-style=b] .inp{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper)}
[data-style=b] .inp:focus{box-shadow:4px 4px 0 var(--volt)}
[data-style=b] .logo{background:var(--ink);color:var(--volt);border-radius:8px;border:2.5px solid var(--ink)}
[data-style=b] .num{border:2.5px solid var(--ink);border-radius:7px;background:var(--paper)}
[data-style=b] .steps li.cur .num{background:var(--ink);color:var(--volt)}[data-style=b] .steps li.done .num{background:var(--volt)}
[data-style=b] .steps li.cur{font-weight:800;background:var(--paper);border:2.5px solid var(--ink);border-radius:8px}
[data-style=b] .banner{background:var(--volt);border:2.5px solid var(--ink);border-radius:8px}[data-style=b] .banner.info{background:var(--grey)}
[data-style=b] .err{background:var(--volt);border:2px solid var(--ink);border-radius:6px;padding:4px 10px;display:inline-block}[data-style=b] .err::before{content:"! "}
[data-style=b] .card-opt{border-radius:10px}[data-style=b] .card-opt.sel{background:var(--volt)}
[data-style=b] .tw{border:2.5px solid var(--ink);border-radius:8px}
[data-style=b] th{background:var(--ink);color:var(--paper)}[data-style=b] td{border-top:2px solid var(--ink)}
[data-style=b] .pill{border:2px solid var(--ink);border-radius:6px;background:var(--grey)}[data-style=b] .pill.warn{background:var(--volt)}[data-style=b] .pill.bad{background:var(--ink);color:var(--paper)}
[data-style=b] .map{border:2.5px solid var(--ink);border-radius:8px}
[data-style=b] .shopcard{border:2.5px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);background:var(--paper)}
[data-style=b] .lab{border:2px solid var(--ink);border-radius:6px;background:var(--volt)}[data-style=b] .lab.warn{background:var(--grey)}
[data-style=b] .plan{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:6px 6px 0 var(--ink)}
[data-style=b] .plan.rec{background:var(--volt)}
[data-style=b] .kpi{border:2.5px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink)}
[data-style=b] .mbar{border:2px solid var(--ink);border-radius:6px;background:var(--paper)}[data-style=b] .mbar i{background:var(--ink)}
[data-style=b] .app.phone{border:3px solid var(--ink);border-radius:30px;padding:8px;background:var(--grey);box-shadow:8px 8px 0 var(--ink)}
[data-style=b] .app.phone .main{border-radius:22px;box-shadow:none}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;border:2.5px solid var(--ink);border-radius:6px;background:var(--paper);display:inline-grid;place-content:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--volt)}input[type=checkbox]:checked::after{content:"✓";font-weight:900;font-size:17px;line-height:1;color:var(--ink)}
</style>
</head>

/* ---------------- keep icons inside the 4-colour palette: draw emoji as navy silhouettes ---------------- */
function wrapEmoji(root) {
  const rx = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*/gu, one = /\p{Extended_Pictographic}/u;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement.closest(".em,script,style,textarea,option") || !one.test(n.data) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) { const f = document.createDocumentFragment(); let last = 0;
    n.data.replace(rx, (m, i) => { f.append(n.data.slice(last, i)); const sp = document.createElement("span"); sp.className = "em"; sp.textContent = m; f.append(sp); last = i + m.length; });
    f.append(n.data.slice(last)); n.replaceWith(f); }
}

  }
});
document.addEventListener("keydown", (e) => { const el = e.target; if (el.dataset?.otp !== undefined && e.key === "Backspace" && !el.value && +el.dataset.otp > 0) $(`[data-otp="${+el.dataset.otp - 1}"]`).focus(); if (e.key === "Escape") $("#modal").classList.remove("on"); });
document.addEventListener("paste", (e) => { if (e.target.dataset?.otp === undefined) return; const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (!d) return; e.preventDefault(); $$("[data-otp]").forEach((x, i) => (x.value = d[i] || "")); if (d.length === 6) A.verifyOtp(); });
// map: tap or drag the pin
let drag = false;
const place = (e) => { const m = $("#map"); if (!m) return; const r = m.getBoundingClientRect(); S.branch.pinAt = [Math.min(98, Math.max(2, ((e.clientX - r.left) / r.width) * 100)), Math.min(96, Math.max(8, ((e.clientY - r.top) / r.height) * 100))].map((n) => +n.toFixed(1)); m.innerHTML = `<span class="pin" style="left:${S.branch.pinAt[0]}%;top:${S.branch.pinAt[1]}%">${PIN}</span>`; const ps = $("#pinState"); if (ps) ps.innerHTML = `<b>${t("pinSet")}</b>`; setErr("loc", ""); };
document.addEventListener("pointerdown", (e) => { if (e.target.closest("#map")) { drag = true; place(e); } });
document.addEventListener("pointermove", (e) => { if (drag) place(e); });
document.addEventListener("pointerup", () => (drag = false));
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal" && S.pay.state !== "processing") $("#modal").classList.remove("on"); });

const q = new URLSearchParams(location.search);   // ?style=b&lang=hi&device=phone&step=plans for quick links
if (q.get("lang")) S.lang = q.get("lang") === "hi" ? "hi" : "en"; if (q.get("device") === "phone") S.device = "phone";
if (q.get("step") && screens[q.get("step")]) { S.step = q.get("step"); S.phone = "9876543210"; S.org.name = "Sharma Hardware & Paints"; S.branch = { ...S.branch, name: "Jayanagar 4th Block", addr: "12, 4th Block", area: "Jayanagar", pin: "560011", pinAt: [48, 52] }; if (!["org", "branch"].includes(S.step)) { S.products = SAMPLE.map(([name, hi, unit, price], i) => ({ name, hi, unit, price, qty: 8 + ((i * 7) % 40), thr: 5, so: i === 9 })); } }
render();
})();
